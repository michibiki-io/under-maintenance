<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>

    <linearGradient id="screenGradient" x1="360" y1="210" x2="850" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F7FF"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="410" y1="300" x2="790" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#1E293B" flood-opacity="0.14"/>
    </filter>

    <filter id="tinyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Decorative background shapes -->
  <circle cx="220" cy="170" r="72" fill="#DBEAFE" opacity="0.65"/>
  <circle cx="1010" cy="610" r="95" fill="#CCFBF1" opacity="0.55"/>
  <circle cx="950" cy="180" r="26" fill="#BFDBFE" opacity="0.7"/>
  <circle cx="270" cy="610" r="18" fill="#99F6E4" opacity="0.8"/>

  <path d="M130 470 C210 410, 290 530, 370 470" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M850 285 C930 215, 1010 325, 1080 265" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- Main monitor -->
  <g filter="url(#softShadow)">
    <rect x="310" y="190" width="580" height="390" rx="34" fill="url(#screenGradient)"/>
    <rect x="310" y="190" width="580" height="72" rx="34" fill="#0F172A"/>
    <path d="M310 228C310 207.013 327.013 190 348 190H852C872.987 190 890 207.013 890 228V262H310V228Z" fill="#111827"/>

    <circle cx="365" cy="226" r="9" fill="#EF4444"/>
    <circle cx="397" cy="226" r="9" fill="#F59E0B"/>
    <circle cx="429" cy="226" r="9" fill="#10B981"/>

    <rect x="360" y="310" width="480" height="18" rx="9" fill="#E2E8F0"/>
    <rect x="360" y="352" width="350" height="16" rx="8" fill="#E2E8F0"/>
    <rect x="360" y="395" width="420" height="16" rx="8" fill="#E2E8F0"/>

    <text x="600" y="400" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">メンテナンス中です</text>
    <text x="600" y="430" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">しばらくしてから再度お試しください。</text>

    <rect x="360" y="462" width="170" height="46" rx="23" fill="url(#accentGradient)"/>
    <rect x="555" y="462" width="145" height="46" rx="23" fill="#EAF2FF"/>
    <rect x="585" y="478" width="86" height="14" rx="7" fill="#93C5FD"/>
  </g>

  <!-- Stand -->
  <path d="M555 580H645L660 650H540L555 580Z" fill="#CBD5E1"/>
  <rect x="500" y="650" width="200" height="28" rx="14" fill="#94A3B8"/>

  <!-- Floating cards -->
  <g filter="url(#tinyShadow)">
    <rect x="215" y="340" width="150" height="94" rx="22" fill="#FFFFFF"/>
    <rect x="244" y="368" width="92" height="12" rx="6" fill="#CBD5E1"/>
    <rect x="244" y="394" width="58" height="12" rx="6" fill="#38BDF8"/>
  </g>

  <g filter="url(#tinyShadow)">
    <rect x="835" y="430" width="150" height="94" rx="22" fill="#FFFFFF"/>
    <circle cx="875" cy="477" r="20" fill="#CCFBF1"/>
    <path d="M867 477L873 483L885 469" stroke="#0F766E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="912" y="462" width="44" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="912" y="484" width="58" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- Sparkles -->
  <path d="M514 145L526 172L553 184L526 196L514 223L502 196L475 184L502 172L514 145Z" fill="#60A5FA" opacity="0.9"/>
  <path d="M972 352L980 370L998 378L980 386L972 404L964 386L946 378L964 370L972 352Z" fill="#2DD4BF" opacity="0.9"/>
  <path d="M205 540L211 553L224 559L211 565L205 578L199 565L186 559L199 553L205 540Z" fill="#3B82F6" opacity="0.8"/>

  <!-- Subtle footer line -->
  <rect x="420" y="720" width="360" height="8" rx="4" fill="#DBEAFE"/>
  <rect x="500" y="720" width="200" height="8" rx="4" fill="#93C5FD"/>
</svg>
